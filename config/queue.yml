development: &development
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ orders, emails, default ]
      threads: 3
      polling_interval: 1

production:
  <<: *development
  dispatchers:
    - polling_interval: 1
      batch_size: 1000
      concurrency_maintenance_interval: 300
  workers:
    - queues: [ orders ]
      threads: 3
      processes: 2
      polling_interval: 1
    - queues: [ emails ]
      threads: 2
      processes: 1
      polling_interval: 0.5
    - queues: [ default ]
      threads: 2
      polling_interval: 2
